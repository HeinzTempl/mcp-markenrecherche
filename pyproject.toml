[project]
name = "mcp-markenrecherche"
version = "0.1.0"
description = "MCP-Server für die Markenrecherche AT/EU — EUIPO-APIs, TMview, Variantenlogik, konsolidierter Recherchelauf"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
